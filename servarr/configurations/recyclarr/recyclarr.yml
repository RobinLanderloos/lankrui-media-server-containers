# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
#
# Recyclarr v8 configuration. Profiles are guide-backed (trash_id) and custom formats
# come from CF groups. See https://recyclarr.dev/guide/upgrade-guide/v8.0/
#
# `name` on a profile keeps the name that already exists in Sonarr/Radarr, so the
# profile is adopted instead of duplicated.

sonarr:
  sonarr-anime:
    base_url: !secret sonarr_anime_url
    api_key: !secret sonarr_anime_apikey

    quality_definition:
      type: anime

    media_naming:
      series: plex-tvdb
      season: default
      episodes:
        rename: true
        standard: default
        daily: default
        anime: default

    quality_profiles:
      - trash_id: 20e0fc959f1f1704bed501f23bdae76f # [Anime] Remux-1080p
        name: Remux-1080p - Anime
        reset_unmatched_scores:
          enabled: true

    custom_format_groups:
      add: []
      skip: []

    # Custom Formats: https://recyclarr.dev/reference/configuration/custom-formats/
    custom_formats:
      - trash_ids:
          - 026d5aadd1a6b4e550b134cb6c72b3ca # Uncensored
        assign_scores_to:
          - name: Remux-1080p - Anime
            score: 750

      - trash_ids:
          - b2550eb333d27b75833e25b8c2557b38 # 10bit
        assign_scores_to:
          - name: Remux-1080p - Anime
            score: 0

      - trash_ids:
          - 418f50b10f1907201b6cfdf881f467b7 # Anime Dual Audio
        assign_scores_to:
          - name: Remux-1080p - Anime
            score: 1500

      # Hand-made "Dual Audio" profile (not guide-backed). Block the same unwanted
      # releases as the managed profile; otherwise Dual Audio's +15000 outweighs them.
      - trash_ids:
          - b4a1b3d705159cdca36d71e57ca86871 # Anime Raws
          - e3515e519f3b1360cbfc17651944354c # Anime LQ Groups
          - 9c14d194486c4014d422adc64092d794 # Dubs Only
          - 07a32f77690263bb9fda1842db7e273f # VOSTFR
          - 15a05bc7c1a36e2b57fd628f8977e2fc # AV1
        assign_scores_to:
          - name: Remux-1080p - Anime - Dual Audio
            score: -10000

  sonarr:
    base_url: !secret sonarr_url
    api_key: !secret sonarr_apikey

    quality_definition:
      type: series

    # Season folder is intentionally not managed: existing folders are "Season N" (unpadded)
    # and changing the format would move every file on the next rename.
    media_naming:
      series: plex-tvdb
      episodes:
        rename: true
        standard: default
        daily: default
        anime: default

    quality_profiles:
      - trash_id: 72dae194fc92bf828f32cde7744e51a1 # WEB-1080p
        name: WEB-1080p
        reset_unmatched_scores:
          enabled: true
      - trash_id: d1498e7d189fbe6c7110ceaabb7473e6 # WEB-2160p
        name: WEB-2160p
        reset_unmatched_scores:
          enabled: true

    custom_format_groups:
      add:
        - trash_id: 158188097a58d7687dee647e04af0da3 # [Optional] Golden Rule HD
        - trash_id: e3f37512790f00d0e89e54fe5e790d1c # [Optional] Golden Rule UHD
        - trash_id: 85fae4a2294965b75710ef2989c850eb # [Streaming Services] HD/UHD boost
        - trash_id: 59c3af66780d08332fdc64e68297098f # [Unwanted] Unwanted Formats
        # Block Dolby Vision releases without an HDR10 fallback (not all devices support DV)
        - trash_id: d776a1ea912a117d66d83b880ff2055d # [HDR Formats] DV (w/o HDR fallback)
        # Block ALL SDR releases. Swap to "SDR (no WEBDL)" (83304f26...) to allow SDR WEB.
        - trash_id: e1053c0ef622df3749fa43c22865663a # [HDR Formats] SDR
          select:
            - 2016d1676f5ee13a5b7257ff86ac9a93 # SDR
        # HDR10+ Boost, uncomment if any of your devices support HDR10+
        # - trash_id: 7d366c213e5c23a052b157356fac1921 # [HDR Formats] HDR10+ Boost
      skip: []

    custom_formats:
      # Disable x265 from HD-1080p (Sonarr's built-in profile, not guide-backed)
      - trash_ids:
          - c9eafd50846d299b862ca9bb6ea91950 # x265
          - 47435ece6b99a0b477caf360e79ba0bb # x265 (HD)
        assign_scores_to:
          - name: HD-1080p
            score: -2000

radarr:
  radarr:
    base_url: !secret radarr_url
    api_key: !secret radarr_apikey

    quality_definition:
      type: movie

    media_naming:
      folder: plex-tmdb
      movie:
        rename: true
        standard: plex-tmdb

    quality_profiles:
      - trash_id: d1d67249d3890e49bc12e275d989a7e9 # HD Bluray + WEB
        name: HD Bluray + WEB
        reset_unmatched_scores:
          enabled: true
      - trash_id: 64fb5f9858489bdac2af690e27c8f42f # UHD Bluray + WEB
        name: UHD Bluray + WEB
        reset_unmatched_scores:
          enabled: true
      - trash_id: 9ca12ea80aa55ef916e3751f4b874151 # Remux + WEB 1080p
        name: Remux + WEB 1080p
        reset_unmatched_scores:
          enabled: true
      - trash_id: fd161a61e3ab826d3a22d53f935696dd # Remux + WEB 2160p
        name: Remux + WEB 2160p
        reset_unmatched_scores:
          enabled: true

    custom_format_groups:
      add:
        - trash_id: f8bf8eab4617f12dfdbd16303d8da245 # [Optional] Golden Rule HD
        - trash_id: ff204bbcecdd487d1cefcefdbf0c278d # [Optional] Golden Rule UHD
        - trash_id: a3ac6af01d78e4f21fcb75f601ac96df # [Unwanted] Unwanted Formats
        # Block Dolby Vision releases without an HDR10 fallback (not all devices support DV)
        - trash_id: 7fc2751eef7e6bdc70b74136e5e35c76 # [HDR Formats] DV (w/o HDR fallback)
        # Block ALL SDR releases. Swap to "SDR (no WEBDL)" (25c12f78...) to allow SDR WEB.
        - trash_id: 47f0d69750de9e16855915fa73bb7b08 # [HDR Formats] SDR
          select:
            - 9c38ebb7384dada637be8899efa68e6f # SDR
        # HDR10+ Boost, uncomment if any of your devices support HDR10+
        # - trash_id: b29413a7487478fe98228ce79e5689e4 # [HDR Formats] HDR10+ Boost
      skip: []
