services:
  radarr:
    container_name: radarr
    image: ghcr.io/hotio/radarr:latest
    restart: unless-stopped
    logging:
      driver: json-file
    network_mode: bridge
    ports:
      - 7878:7878
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker-configs/radarr:/config
      - /mnt/data/docker-data:/data
  sonarr:
    container_name: sonarr
    image: ghcr.io/hotio/sonarr:latest
    restart: unless-stopped
    logging:
      driver: json-file
    network_mode: bridge
    ports:
      - 8989:8989
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker-configs/sonarr:/config
      - /mnt/data/docker-data:/data
  sonarr-anime:
    container_name: sonarr-anime
    image: ghcr.io/hotio/sonarr:latest
    restart: unless-stopped
    logging:
      driver: json-file
    network_mode: bridge
    ports:
      - 8998:8989
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker-configs/sonarr-anime:/config
      - /mnt/data/docker-data:/data
  bazarr:
    container_name: bazarr
    image: ghcr.io/hotio/bazarr:latest
    restart: unless-stopped
    logging:
      driver: json-file
    network_mode: bridge
    ports:
      - 6767:6767
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker-configs/bazarr:/config
      - /mnt/data/docker-data/media:/data/media
  prowlarr:
    container_name: prowlarr
    image: ghcr.io/hotio/prowlarr:latest
    restart: unless-stopped
    logging:
      driver: json-file
    network_mode: bridge
    ports:
      - 9696:9696
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker-configs/prowlarr:/config
  qbittorrent:
    image: ghcr.io/hotio/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    logging:
      driver: json-file
    network_mode: bridge
    ports:
      - 8080:8080
    volumes:
      - /docker-configs/qbittorrent:/config
      - /mnt/data/docker-data/torrents:/data/torrents
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
      - WEBUI_PORTS=8080
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr 
    restart: unless-stopped
    logging:
      driver: json-file
    network_mode: bridge
    ports:
      - 5055:5055
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
    volumes:
      - /docker-configs/overseerr:/app/config
  sabnzbd:
    image: ghcr.io/hotio/sabnzbd:latest
    container_name: sabnzbd
    restart: unless-stopped
    logging:
      driver: json-file
    network_mode: bridge
    ports:
      - 8081:8080
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker-configs/sabnzbd:/config
      - /docker-data/sabnzbd-cache:/data/cache # Your incomplete downloads should download to an SSD for faster unpacking speeds
      - /mnt/data/docker-data/usenet:/data/usenet
  plex:
    image: ghcr.io/hotio/plex:latest
    container_name: plex
    restart: unless-stopped
    logging:
      driver: json-file
    network_mode: bridge
    ports:
      - 32400:32400
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker-configs/plex:/config
      - /mnt/data/docker-data/media:/data/media
      - /tmp/plex:/transcode
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
      - VERSION=docker
      - PLEX_CLAIM_TOKEN=${PLEX_CLAIM_TOKEN}
  tautulli:
    image: ghcr.io/hotio/tautulli
    container_name: tautulli
    restart: unless-stopped
    logging:
      driver: json-file
    network_mode: bridge
    ports:
      - 8181:8181
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker-configs/tautulli:/config
  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest # maintained fork of the archived containrrr/watchtower
    container_name: watchtower
    network_mode: bridge
    restart: unless-stopped
    logging:
      driver: json-file
    environment:
      - TZ=Europe/Amsterdam
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock
    # Runs at 03:00 local time, 30 minutes after the config-backup service below
    command: --cleanup --schedule "0 0 3 * * *"
  config-backup:
    image: ghcr.io/offen/docker-volume-backup:v2
    container_name: config-backup
    restart: unless-stopped
    network_mode: bridge
    user: 1000:1000
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      - TZ=Europe/Amsterdam
      - BACKUP_CRON_EXPRESSION=30 2 * * *
      - BACKUP_FILENAME=docker-configs-%Y-%m-%d_%H-%M-%S.tar.gz
      - BACKUP_PRUNING_PREFIX=docker-configs-
      - BACKUP_RETENTION_DAYS=14
      # Skip data that can be rebuilt: Plex metadata/media/cache, logs, recyclarr's git cache, leftovers
      - BACKUP_EXCLUDE_REGEXP=/(Metadata|Media|Cache|Temp|Codecs|Crash Reports|Logs|logs|repositories|jellyfin|jellyseerr)(/|$)|\.zip$
    volumes:
      - /docker-configs:/backup/docker-configs:ro
      # Backups go to the data disk so a failure of the system disk does not take them along
      - /mnt/data/backups/docker-configs:/archive
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:latest
    container_name: recyclarr
    user: 1000:1000
    restart: unless-stopped
    network_mode: bridge
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /docker-configs/recyclarr:/config
